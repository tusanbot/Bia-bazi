name = "bia-bazi-web"
main = ".open-next/worker.js"
compatibility_date = "2026-09-26"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[observability]
enabled = true

# Set this in Cloudflare Workers > Settings > Variables and Secrets.
# It must point to the deployed workers/game-room Worker, for example:
# GAME_ROOM_URL = "https://bia-bazi.<your-subdomain>.workers.dev"
