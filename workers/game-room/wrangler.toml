name = "bia-bazi"
main = "src/room-do.ts"
compatibility_date = "2026-09-26"
compatibility_flags = ["nodejs_compat"]

[[durable_objects.bindings]]
name = "GAME_ROOM"
class_name = "GameRoomDurableObject"

[[d1_databases]]
binding = "DB"
database_name = "bia-bazi"
database_id = "656a8f6e-baec-47ca-8f0b-6c43d390c0d4"
migrations_dir = "migrations"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["GameRoomDurableObject"]

[assets]
directory = "../../apps/web/out"
binding = "ASSETS"
run_worker_first = true
not_found_handling = "single-page-application"

[observability]
enabled = true

[vars]
# Set with: wrangler secret put TELEGRAM_BOT_TOKEN
# Set with: wrangler secret put TELEGRAM_WEBHOOK_SECRET
# Admin panel credentials/session:
# wrangler secret put ADMIN_USERNAME
# wrangler secret put ADMIN_PASSWORD
# wrangler secret put ADMIN_SESSION_SECRET
# Optional internal token for Durable Object admin commands:
# wrangler secret put ADMIN_INTERNAL_TOKEN
